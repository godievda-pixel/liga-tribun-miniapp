<style id="lt-shell-fix-v3">

.rating-podium-card.place-1{min-height:176px;border-color:rgba(38,206,41,.24);background:radial-gradient(circle at 50% 0%,rgba(38,206,41,.14),transparent 52%),linear-gradient(160deg,#142019,#0a0f0c)}
.rating-podium-card.place-2,.rating-podium-card.place-3{min-height:158px}
.rating-medal{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);font-size:9px;font-weight:950;color:#9aa59e}
.place-1 .rating-medal{background:rgba(38,206,41,.10);border-color:rgba(38,206,41,.22);color:#53ec57}
.rating-podium-name{margin-top:14px;font-size:11px;font-weight:950;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating-podium-score{margin-top:13px}.rating-podium-score strong{display:block;font-size:25px;line-height:.9;letter-spacing:-.055em;color:#48e84c}.rating-podium-score span{display:block;margin-top:5px;color:#77827b;font-size:6px;text-transform:uppercase;letter-spacing:.08em}
.rating-podium-meta{margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.055);color:#69746d;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating-table-premium{display:grid;gap:6px}
.rating-row-premium{width:100%;min-height:64px;border:1px solid rgba(255,255,255,.065);border-radius:18px;background:linear-gradient(145deg,#101612,#0a0f0c);color:inherit;padding:9px 11px;display:grid;grid-template-columns:26px minmax(0,1fr) 48px 43px;gap:8px;align-items:center;text-align:left}
.rating-rank{font-size:11px;font-weight:950;color:#89958e;text-align:center}
.rating-person{min-width:0}.rating-person b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rating-person small{display:block;margin-top:4px;color:#6e7972;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating-average{text-align:right}.rating-average strong{display:block;color:#49e84d;font-size:15px;letter-spacing:-.035em}.rating-average span,.rating-total span{display:block;color:#657069;font-size:6px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.rating-total{text-align:right;padding-left:7px;border-left:1px solid rgba(255,255,255,.055)}.rating-total b{display:block;color:#bac4be;font-size:10px}
.lt-next-placeholder{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:21px 20px;background:radial-gradient(circle at 90% 0%,rgba(38,206,41,.10),transparent 42%),linear-gradient(145deg,#121914,#0a0f0c);box-shadow:0 18px 48px rgba(0,0,0,.22)}
.lt-placeholder-watermark{position:absolute;right:-18px;bottom:-30px;font-size:120px;font-weight:1000;letter-spacing:-.12em;color:rgba(255,255,255,.025);pointer-events:none}
.lt-next-placeholder h2{position:relative;margin:10px 0 8px;max-width:82%;font-size:25px;line-height:1;letter-spacing:-.045em}
.lt-next-placeholder p{position:relative;margin:0;max-width:78%;color:#839087;font-size:10px;line-height:1.5}
.lt-placeholder-actions{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:19px}
@media(max-width:390px){
 .rating-podium{grid-template-columns:1fr 1fr;align-items:stretch}
 .rating-podium-card.place-1{grid-column:1/-1;min-height:146px}
 .rating-podium-card.place-2,.rating-podium-card.place-3{min-height:142px}
}
</style>

(function(){

function e(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function render(){nav();syncChrome();if(S.view==='home')home();else if(S.view==='tours')tours();else if(S.view==='rating')rating();else if(S.view==='profile')profile();else if(S.view==='player')player();else archive()}
async function identify(){if(S.meChecked)return;S.meChecked=true;if(!tg||!tg.initData)return;try{var r=await fetch(API+'?app=me',{method:'POST',body:tg.initData,cache:'no-store'}),d=await r.json();S.me=d}catch(x){S.me=null}}async function load(silent){try{var d=await(await fetch(API+'?app=bootstrap&_='+Date.now(),{cache:'no-store'})).json();if(!d.ok)throw 0;S.data=d;if(!S.meChecked)await identify();document.body.classList.remove('is-loading');if(S.view!=='archive'&&S.view!=='player')render()}catch(x){document.body.classList.remove('is-loading');if(!silent)R.innerHTML='<div class="empty">Не удалось подключиться к данным Лиги Трибун</div>'}}
R.addEventListener('click',function(ev){var topProfile=ev.target&&ev.target.closest?ev.target.closest('[data-top-profile]'):null;if(topProfile){ev.preventDefault();openMyProfile();return}var archiveCard=ev.target&&ev.target.closest?ev.target.closest('[data-a]'):null;if(archiveCard){ev.preventDefault();openA(archiveCard.getAttribute('data-a'));return}var go=ev.target&&ev.target.closest?ev.target.closest('[data-home-view]'):null;if(go){ev.preventDefault();S.view=go.getAttribute('data-home-view');S.archive=null;S.player=null;S.ratingArchive='all';if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.selectionChanged()}catch(e){}render();return}var fav=ev.target&&ev.target.closest?ev.target.closest('[data-favorite-club-open]'):null;if(fav){ev.preventDefault();openClubSheet();return}var el=ev.target&&ev.target.closest?ev.target.closest('[data-player]'):null;if(el){ev.preventDefault();openPlayer(el.getAttribute('data-player'))}});document.addEventListener('click',function(ev){var sh=document.getElementById('favorite-club-sheet');if(!sh||sh.hidden)return;var close=ev.target&&ev.target.closest?ev.target.closest('[data-club-close]'):null;if(close||ev.target===sh){closeClubSheet();return}var opt=ev.target&&ev.target.closest?ev.target.closest('[data-club-key]'):null;if(opt)saveFavoriteClub(opt.getAttribute('data-club-key'))});
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){var v=b.getAttribute('data-v');if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.selectionChanged()}catch(e){}if(v==='profile'){openMyProfile();return}S.view=v;S.archive=null;S.player=null;S.ratingArchive='all';render()}});load(false);setInterval(function(){load(true)},30000)
})();
</script></body></html>
