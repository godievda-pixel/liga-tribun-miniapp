<style id="lt-shell-fix-v3">
html,body{min-height:100%;background:#050706}

.app{width:100%;max-width:720px;min-height:100dvh;margin:0 auto;padding:12px 12px calc(104px + env(safe-area-inset-bottom));position:relative}

function ruForm(n,one,few,many){n=Math.abs(Number(n)||0);var n10=n%10,n100=n%100;if(n10===1&&n100!==11)return one;if(n10>=2&&n10<=4&&(n100<12||n100>14))return few;return many}
