<style id="lt-shell-fix-v3">
html,body{min-height:100%;background:#050706}
body{overflow-x:hidden}
.app{width:100%;max-width:720px;min-height:100dvh;margin:0 auto;padding:12px 12px calc(104px + env(safe-area-inset-bottom));position:relative}

.top{position:relative;top:auto;z-index:4;padding:6px 2px 14px;margin:0;background:transparent;backdrop-filter:none}

function player(){var p=S.player;if(!p){S.view='rating';rating();return}var h=p.history||[];R.innerHTML='<button class="back" id="backp">← Рейтинг</button><section class="hero"><div class="kicker">Профиль участника</div><h1>'+e(p.teamName)+'</h1><div class="muted">№ '+e(p.rank)+' в общем рейтинге · '+e(p.tournaments)+' турниров</div></section><div class="stats"><div class="stat"><b>'+e(p.total)+'</b><span>очков рейтинга</span></div><div class="stat"><b>'+e(p.goldWins||0)+'</b><span>побед в Золоте</span></div><div class="stat"><b>'+e(p.w||0)+'</b><span>побед в матчах</span></div><div class="stat"><b>'+e((p.gf||0)-(p.ga||0))+'</b><span>разница мячей</span></div></div><section class="section"><div class="head"><h2>Статистика</h2><span>за все турниры</span></div><div class="card"><div class="rr"><div class="rk">В</div><div class="rn"><b>'+e(p.w||0)+' побед</b><small>Н '+e(p.d||0)+' · П '+e(p.l||0)+'</small></div><div class="pts"><b>'+e(p.gf||0)+':'+e(p.ga||0)+'</b><small>голы</small></div></div></div></section><section class="section"><div class="head"><h2>История турниров</h2><span>'+h.length+'</span></div><div class="grid">'+(h.length?h.map(function(x){var place=x.goldPlace?'Золото · '+x.goldPlace+' место':x.silverPlace?'Серебро · '+x.silverPlace+' место':'Место в рейтинге турнира: '+x.rank;return'<button class="card tour" data-a="'+e(x.id)+'"><div class="history"><div><b>'+e(x.name)+'</b><small>'+date(x.createdAt)+' · '+e(x.total)+' очков · В '+e(x.w)+' / П '+e(x.l)+'</small><div class="place">'+e(place)+'</div></div><span class="arrow">›</span></div></button>'}).join(''):'<div class="empty">История пока пустая</div>')+'</div></section>';document.getElementById('backp').onclick=function(){S.player=null;S.view='rating';nav();rating()};R.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){openA(b.getAttribute('data-a'))}})}
async function openPlayer(name){R.innerHTML='<div class="loading"></div>';try{var d=await(await fetch(API+'?app=player&name='+encodeURIComponent(name),{cache:'no-store'})).json();if(!d.ok)throw 0;S.player=d.player;S.view='player';nav();player()}catch(x){R.innerHTML='<div class="empty">Не удалось загрузить профиль участника</div>'}}
function nav(){document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===S.view)})}
function render(){nav();if(S.view==='home')home();else if(S.view==='tours')tours();else if(S.view==='rating')rating();else if(S.view==='player')player();else archive()}
async function identify(){if(S.meChecked)return;S.meChecked=true;if(!tg||!tg.initData)return;try{var r=await fetch(API+'?app=me',{method:'POST',body:tg.initData,cache:'no-store'}),d=await r.json();S.me=d}catch(x){S.me=null}}async function load(silent){try{var d=await(await fetch(API+'?app=bootstrap&_='+Date.now(),{cache:'no-store'})).json();if(!d.ok)throw 0;S.data=d;if(!S.meChecked)await identify();document.body.classList.remove('is-loading');if(S.view!=='archive'&&S.view!=='player')render()}catch(x){document.body.classList.remove('is-loading');if(!silent)R.innerHTML='<div class="empty">Не удалось подключиться к данным Лиги Трибун</div>'}}
R.addEventListener('click',function(ev){var fav=ev.target&&ev.target.closest?ev.target.closest('[data-favorite-club-open]'):null;if(fav){ev.preventDefault();openClubSheet();return}var el=ev.target&&ev.target.closest?ev.target.closest('[data-player]'):null;if(el){ev.preventDefault();openPlayer(el.getAttribute('data-player'))}});document.addEventListener('click',function(ev){var sh=document.getElementById('favorite-club-sheet');if(!sh||sh.hidden)return;var close=ev.target&&ev.target.closest?ev.target.closest('[data-club-close]'):null;if(close||ev.target===sh){closeClubSheet();return}var opt=ev.target&&ev.target.closest?ev.target.closest('[data-club-key]'):null;if(opt)saveFavoriteClub(opt.getAttribute('data-club-key'))});
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){S.view=b.getAttribute('data-v');S.archive=null;S.player=null;S.ratingArchive='all';if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.selectionChanged()}catch(e){}render()}});load(false);setInterval(function(){load(true)},30000)
})();
</script></body></html>
